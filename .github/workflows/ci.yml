name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --all-targets
      # 2026-10-30: cargo test commented out — suite is not yet deterministic
      # (distribution tests lack seeds; see README). Re-enable when tests are
      # stable: auto-merge will start requiring them immediately.
      # - run: cargo test

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - run: nix develop .#hardware --command make -C npu lint

  auto-merge:
    name: auto-merge
    runs-on: ubuntu-latest
    needs: [rust, lint]                  # only runs after green gates
    if: ${{ !startsWith(github.head_ref, 'agent/') }}   # agent PRs stay for human review
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - name: merge if small
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          BASE: ${{ github.event.pull_request.base.ref }}
        run: |
          N=$(git diff --numstat "origin/$BASE...HEAD" | awk '{a+=$1+$2} END {print a+0}')
          echo "lines changed: $N (limit 50)"
          if [ "$N" -le 50 ]; then
            gh pr merge "$PR" --merge
            echo "merged: small PR with green gates"
          else
            echo "above 50 lines — awaiting human review"
          fi
