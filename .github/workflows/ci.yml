name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: compile - lib and bins (entry points)
        run: cargo build --lib --bins

      - name: run tests
        run: cargo test
        # 2026-10-30: suite still consolidating - unseeded distribution
        # tests may fail intermittently. On intermittent red, re-run the
        # job; the root fix (fixed seeds) follows later.

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - run: nix develop .#hardware --command make -C npu lint

  auto-merge:
    name: auto-merge
    runs-on: ubuntu-latest
    needs: [rust, lint]                  # only runs after green gates
    # PR events only: on push there is no PR to merge (head_ref is empty,
    # which passes the agent guard and then fails on `gh pr merge ""`).
    # On push this job shows as skipped (neutral), keeping main's checks green.
    if: ${{ github.event_name == 'pull_request' && !startsWith(github.head_ref, 'agent/') }}
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - name: merge if small
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          BASE: ${{ github.event.pull_request.base.ref }}
        run: |
          N=$(git diff --numstat "origin/$BASE...HEAD" | awk '{a+=$1+$2} END {print a+0}')
          echo "lines changed: $N (limit 200)"
          if [ "$N" -le 200 ]; then
            gh pr merge "$PR" --merge
            echo "merged: small PR with green gates"
          else
            echo "above 200 lines - awaiting human review"
          fi
